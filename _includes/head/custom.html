{% include base_path %}

<!-- start custom head snippets -->

<!-- Site icon. SVG for modern browsers, multi-size ICO as the fallback,
     180px PNG for iOS home screens. Bump the ?v= value whenever the icon files change,
     otherwise browsers keep showing the cached old icon. -->
<link rel="icon" href="{{ base_path }}/images/favicon.ico?v=ly1" sizes="32x32">
<link rel="icon" href="{{ base_path }}/images/favicon.svg?v=ly1" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png?v=ly1">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
